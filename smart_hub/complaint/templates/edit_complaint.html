<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Complaint</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --accent-blue: #007AFF;
            --border-color: #E5E5EA;
        }

        body {
            font-family: 'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: var(--bg-color);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .modal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }

        .detail-row {
            display: flex; justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .label { color: var(--text-secondary); font-size: 14px; }
        .value { font-weight: 500; text-align: right; }
        
        .description-box {
            background: #F2F2F7;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        select {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            margin-bottom: 24px;
            appearance: none;
            background: white url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007AFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E") no-repeat right 16px center;
            background-size: 12px;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px; font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-save:hover { background: #0062CC; }
        
        .btn-cancel {
            display: block; text-align: center; margin-top: 16px;
            color: var(--text-secondary); text-decoration: none; font-size: 15px;
        }

        @media (max-width: 480px) {
            .modal-card { padding: 24px; }
            .header { margin-bottom: 24px; }
            .header h2 { font-size: 20px; }
            body { padding: 16px; align-items: flex-start; }
            .detail-row { padding: 12px 0; }
        }
    </style>
</head>
<body>
    <div class="modal-card">
        <div class="header">
            <h2>Update Status</h2>
            <p>Complaint #{{ complaint.complaint_id }}</p>
        </div>
        
        <div class="detail-row">
            <span class="label">Issue</span>
            <span class="value">{{ complaint.issue }}</span>
        </div>
        <div class="detail-row">
            <span class="label">Location</span>
            <span class="value">{{ complaint.area_name }}</span>
        </div>
        
        <div class="description-box">
            {{ complaint.description }}
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <label style="display:block; margin-bottom:8px; font-size:13px; color:var(--text-secondary); font-weight:600; text-transform:uppercase;">Set New Status</label>
            <select name="complaint_status">
                <option value="open" {% if complaint.complaint_status == 'open' %}selected{% endif %}>Open</option>
                <option value="in progress" {% if complaint.complaint_status == 'in progress' %}selected{% endif %}>In Progress</option>
                <option value="resolved" {% if complaint.complaint_status == 'resolved' %}selected{% endif %}>Resolved</option>
            </select>
            
            <button type="submit" class="btn-save">Save Changes</button>
            <a href="{% url 'admin_dashboard' %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
